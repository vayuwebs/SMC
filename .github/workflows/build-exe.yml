name: Build Windows Installer (.exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

jobs:
  build-windows-exe:
    name: Build Windows .exe Installer
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify cloud connection
        env:
          MAIN_VITE_SUPABASE_URL: ${{ secrets.MAIN_VITE_SUPABASE_URL || 'https://yshlmruzmfmbqpztmagp.supabase.co' }}
          MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MAIN_VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_SWv-5LtzHz-1xIdWsQLpvQ_R5yP-hGz' }}
        run: node scripts/check-cloud.mjs

      - name: Build Windows installer (.exe)
        env:
          MAIN_VITE_SUPABASE_URL: ${{ secrets.MAIN_VITE_SUPABASE_URL || 'https://yshlmruzmfmbqpztmagp.supabase.co' }}
          MAIN_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MAIN_VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_SWv-5LtzHz-1xIdWsQLpvQ_R5yP-hGz' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pack:win

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMC-Accounts-Setup-exe
          path: |
            release/*.exe
            release/*.exe.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
